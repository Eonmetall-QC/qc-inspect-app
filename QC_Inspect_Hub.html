<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPQC Inspect — fill a form</title>
<link rel="manifest" href="manifest-inspect.webmanifest">
<meta name="theme-color" content="#1558b0">
<link rel="apple-touch-icon" href="ipqc-inspect-192.png">
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#17202a;--quiet:#5f6b7a;--line:#dde1e6;--accent:#1558b0;--accent-bg:#e8f0fc}
  @media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2126;--ink:#e8eaed;--quiet:#9aa4b1;--line:#2f353c;--accent:#7aa2ff;--accent-bg:#1c2740}}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;background:var(--accent);color:#fff;padding:14px 16px}
  header h1{margin:0;font-size:18px}
  header .sub{font-size:13px;opacity:.9;margin-top:2px}
  .search{position:sticky;top:60px;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line);z-index:2}
  .search input{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  main{max-width:900px;margin:0 auto;padding:8px 12px 40px}
  .count{color:var(--quiet);font-size:13px;padding:6px 6px 2px}
  a.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:8px 0;text-decoration:none;color:var(--ink)}
  a.item:active{background:var(--accent-bg)}
  a.item .n{font-weight:600;overflow-wrap:anywhere}
  a.item .go{color:var(--accent);font-weight:600;white-space:nowrap}
  .empty{text-align:center;color:var(--quiet);padding:40px 16px}
</style>
</head>
<body>
<header><h1>IPQC Inspect</h1><div class="sub">Tap a product to open its inspection form</div></header>
<div class="search"><input id="q" type="search" placeholder="Search product / form..." autocomplete="off"><button id="refresh" style="margin-top:8px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--accent);font-weight:600;cursor:pointer">Refresh form list</button></div>
<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
<script>
var REPO="Eonmetall-QC/qc-inspect-app";
var API="https://api.github.com/repos/"+REPO+"/contents/";
var EXCLUDE={"QC_Inspect_Hub.html":1,"index.html":1};
var listEl=document.getElementById('list'),qEl=document.getElementById('q'),cEl=document.getElementById('count');
var FORMS=[];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function nameFromFile(fn){return fn.replace(/\.html$/i,'').replace(/-R\d+$/i,'').replace(/_+/g,' ').replace(/\s{2,}/g,' ').trim();}
function render(filter){
  filter=(filter||'').trim().toLowerCase();var out=[],shown=0;
  for(var i=0;i<FORMS.length;i++){var it=FORMS[i];
    if(filter&&(it.n+' '+it.f).toLowerCase().indexOf(filter)===-1)continue;shown++;
    out.push('<a class="item" target="_blank" rel="noopener" href="'+esc(it.f)+'"><span class="n">'+esc(it.n)+'</span><span class="go">Open ›</span></a>');}
  cEl.textContent=shown+' of '+FORMS.length+' forms';
  listEl.innerHTML=out.length?out.join(''):'<div class="empty">No form matches “'+esc(filter)+'”</div>';
}
function loadCached(){try{return JSON.parse(localStorage.getItem('qcForms')||'null');}catch(e){return null;}}
function saveCached(list){try{localStorage.setItem('qcForms',JSON.stringify({t:Date.now(),list:list}));}catch(e){}}
function precache(list){try{if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage({type:'cacheForms',files:list.map(function(x){return x.f;})});}catch(e){}}
function fetchList(){return fetch(API).then(function(r){return r.json();}).then(function(arr){
  if(!Array.isArray(arr))throw new Error('list');
  var list=arr.filter(function(x){return x.type==='file'&&/\.html$/i.test(x.name)&&!EXCLUDE[x.name];})
              .map(function(x){return {f:x.name,n:nameFromFile(x.name)};});
  list.sort(function(a,b){return a.n.toLowerCase().localeCompare(b.n.toLowerCase());});
  return list;});}
var cached=loadCached();
if(cached&&cached.list&&cached.list.length){FORMS=cached.list;render('');}
else cEl.textContent='Loading forms…';
if(navigator.onLine&&(!cached||Date.now()-cached.t>12*3600*1000||!cached.list.length)){
  fetchList().then(function(list){FORMS=list;saveCached(list);render(qEl.value);precache(list);})
             .catch(function(){if(!FORMS.length)cEl.textContent='Could not load the form list. Connect to WiFi once, then reopen.';});
}
qEl.addEventListener('input',function(){render(qEl.value);});
document.getElementById('refresh').addEventListener('click',function(){cEl.textContent='Refreshing…';fetchList().then(function(list){FORMS=list;saveCached(list);render(qEl.value);precache(list);}).catch(function(){cEl.textContent='Refresh failed (need WiFi).';});});
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw-inspect.js');}catch(e){}}
</script>
</body>
</html>
